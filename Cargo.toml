[package]
name = "gray-connect"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray /connect — provider account pools panel and usage cards"

[lib]
name = "gray_connect"
path = "src/lib.rs"

[[bin]]
name = "gray-connect"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
